name: Compila APK Bibirub

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Scarica progetto
        uses: actions/checkout@v4

      - name: Estrai sorgenti Android
        run: |
          unzip -q "Bibirub_Android (11).zip" -d android-project
          test -f android-project/settings.gradle

      - name: Installa Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Prepara Android SDK
        uses: android-actions/setup-android@v3

      - name: Installa SDK Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Prepara Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compila APK
        run: gradle -p android-project --no-daemon assembleDebug

      - name: Consegna APK installabile
        uses: actions/upload-artifact@v4
        with:
          name: APK_Il_Mio_Gin_Vino_Bibirub
          path: android-project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
